<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Time Capsule ♡</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #624650;
    min-height: 100vh;

    background:
        linear-gradient(
            rgba(255, 244, 246, 0.72),
            rgba(255, 247, 242, 0.78)
        ),
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    overflow-x: hidden;
}

/* Soft fallback if background image isn't uploaded */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;

    background:
        radial-gradient(circle at 20% 20%, #fbdde6 0, transparent 28%),
        radial-gradient(circle at 80% 30%, #e8e4f4 0, transparent 25%),
        radial-gradient(circle at 50% 90%, #f8e6c9 0, transparent 30%);

    opacity: 0.8;
}

/* Floating hearts */

.floating-heart {
    position: fixed;
    color: rgba(157, 78, 102, 0.25);
    font-size: 22px;
    pointer-events: none;
    animation: float 7s linear infinite;
    z-index: -1;
}

.heart1 {
    left: 8%;
    bottom: -30px;
    animation-delay: 0s;
}

.heart2 {
    left: 82%;
    bottom: -30px;
    animation-delay: 2s;
}

.heart3 {
    left: 48%;
    bottom: -30px;
    animation-delay: 4s;
}

@keyframes float {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.6;
    }

    100% {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
    }
}

/* Main container */

.container {
    width: 92%;
    max-width: 850px;
    margin: auto;
}

/* Header */

header {
    text-align: center;
    padding: 70px 15px 45px;
}

.small-heart {
    font-size: 48px;
    margin-bottom: 12px;
    animation: heartbeat 2.5s infinite;
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }
}

header h1 {
    font-size: clamp(42px, 10vw, 76px);
    line-height: 0.95;
    color: #934d66;
    font-weight: 600;
    letter-spacing: 1px;
}

.subtitle {
    margin-top: 20px;
    font-size: clamp(21px, 5vw, 28px);
    font-style: italic;
    color: #795964;
}

/* Decorative line */

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 25px 0;
    color: #a65a73;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    width: 70px;
    background: #d9aab8;
}

/* Cards */

.card {
    background: rgba(255, 252, 250, 0.91);
    border: 1px solid rgba(160, 91, 111, 0.18);
    border-radius: 28px;
    padding: 34px;
    margin: 30px 0;

    box-shadow:
        0 15px 45px rgba(90, 50, 60, 0.10);

    backdrop-filter: blur(5px);
}

.card h2 {
    color: #914c65;
    font-size: clamp(30px, 7vw, 43px);
    margin-bottom: 15px;
}

.card p {
    font-size: 21px;
    line-height: 1.7;
}

/* Story */

.story {
    position: relative;
}

.story::after {
    content: "♡";
    position: absolute;
    right: 25px;
    top: 20px;
    font-size: 50px;
    color: #e1a7b8;
}

/* Buttons */

button {
    border: none;
    background: #a95370;
    color: white;

    padding: 14px 23px;
    border-radius: 40px;

    font-family: 'Quicksand', sans-serif;
    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    box-shadow: 0 7px 18px rgba(150, 70, 100, 0.20);

    transition: 0.25s;
}

button:hover {
    transform: translateY(-2px);
    background: #91465f;
}

button:active {
    transform: scale(0.97);
}

/* Memory section */

.memory-form {
    display: none;
    margin-top: 25px;
    padding: 25px;

    background: rgba(255, 245, 247, 0.8);
    border-radius: 22px;
    border: 1px dashed #d9a1b3;
}

.memory-form.show {
    display: block;
}

label {
    display: block;
    font-size: 20px;
    margin: 17px 0 7px;
    color: #754957;
}

input,
textarea {
    width: 100%;

    border: 1px solid #dfc0c9;
    border-radius: 17px;

    padding: 15px;

    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;

    background: rgba(255,255,255,0.75);
    color: #5e414a;

    outline: none;
}

input:focus,
textarea:focus {
    border-color: #b66b83;
    box-shadow: 0 0 0 3px rgba(182,107,131,0.10);
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.save-btn {
    margin-top: 20px;
}

/* Memories displayed */

.memories-list {
    margin-top: 30px;
}

.memory {
    position: relative;

    background: #fffaf8;

    border-left: 5px solid #b86680;
